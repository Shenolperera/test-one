<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiaoItaly - Explore & Review Italy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: '#047857', // Italy Green
                        secondary: '#b91c1c', // Italy Red
                        accent: '#f59e0b', // Rating Yellow
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1516483638261-f40af5baac2a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        /* Custom scrollbar for modals */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<nav class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <span class="text-2xl font-serif font-bold text-primary">Ciao<span class="text-secondary">Italy</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-500 hover:text-primary transition"><i class="fas fa-search text-lg"></i></button>
                <button class="bg-primary text-white px-4 py-2 rounded-full font-medium hover:bg-emerald-700 transition shadow-md">
                    <i class="fas fa-plus mr-1"></i> Add Place
                </button>
                <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 cursor-pointer hover:bg-gray-300">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="hero-bg h-96 flex items-center justify-center text-center px-4">
    <div class="max-w-3xl">
        <h1 class="text-4xl md:text-6xl font-serif font-bold text-white mb-4">Discover the True Italy</h1>
        <p class="text-lg md:text-xl text-gray-200 mb-8">Find and review the best hotels, restaurants, and hidden gems recommended by locals and travelers.</p>
        <div class="bg-white p-2 rounded-full flex shadow-lg max-w-xl mx-auto">
            <input type="text" placeholder="Where do you want to go in Italy?" class="flex-grow px-4 py-2 rounded-l-full outline-none text-gray-700">
            <button class="bg-secondary text-white px-6 py-2 rounded-full font-medium hover:bg-red-800 transition">Search</button>
        </div>
    </div>
</div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Categories -->
    <div class="flex space-x-4 mb-10 overflow-x-auto pb-2">
        <button onclick="filterPlaces('all')" class="cat-btn bg-primary text-white px-6 py-2 rounded-full font-medium shadow-sm flex-shrink-0">All Places</button>
        <button onclick="filterPlaces('hotel')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-6 py-2 rounded-full border border-gray-200 font-medium shadow-sm flex-shrink-0"><i class="fas fa-bed mr-2"></i>Hotels</button>
        <button onclick="filterPlaces('restaurant')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-6 py-2 rounded-full border border-gray-200 font-medium shadow-sm flex-shrink-0"><i class="fas fa-utensils mr-2"></i>Restaurants</button>
        <button onclick="filterPlaces('attraction')" class="cat-btn bg-white text-gray-600 hover:bg-gray-100 px-6 py-2 rounded-full border border-gray-200 font-medium shadow-sm flex-shrink-0"><i class="fas fa-camera mr-2"></i>Attractions</button>
    </div>

    <!-- Places Grid -->
    <div id="places-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- JS will populate this -->
    </div>
</main>

<div id="place-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto transform scale-95 transition-transform duration-300" id="modal-content">
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 w-10 h-10 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-100 z-10">
            <i class="fas fa-times text-xl"></i>
        </button>

        <div id="modal-body">
            <!-- Content dynamically injected here -->
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <i class="fas fa-check-circle mr-2"></i> <span id="toast-msg">Success!</span>
</div>

<script>
    // Mock Data simulating a backend database
    let places = [
        {
            id: 1,
            name: "Grand Hotel Tremezzo",
            category: "hotel",
            location: "Lake Como, Italy",
            image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            description: "Iconic art nouveau masterpiece sitting on the western shores of Lake Como.",
            rating: 4.8,
            reviews: [
                { user: "Sarah J.", text: "Absolutely stunning views! The floating pool is magnificent.", rating: 5, date: "Oct 12, 2025" }
            ]
        },
        {
            id: 2,
            name: "Osteria Francescana",
            category: "restaurant",
            location: "Modena, Italy",
            image: "https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            description: "A three-Michelin-star restaurant offering a modern twist on traditional Italian cuisine.",
            rating: 4.9,
            reviews: [
                { user: "David M.", text: "A culinary journey. Expensive but worth every penny.", rating: 5, date: "Sep 28, 2025" },
                { user: "Elena", text: "Book months in advance! The tortellini is life-changing.", rating: 5, date: "Aug 15, 2025" }
            ]
        },
        {
            id: 3,
            name: "The Colosseum",
            category: "attraction",
            location: "Rome, Italy",
            image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            description: "The largest ancient amphitheatre ever built, right in the heart of Rome.",
            rating: 4.7,
            reviews: [
                { user: "Nuwan F.", text: "Get skip-the-line tickets! It gets very crowded but breathtaking.", rating: 4, date: "Nov 02, 2025" }
            ]
        }
    ];

    let currentSelectedPlaceId = null;

    function renderStars(rating) {
        let stars = '';
        for(let i=1; i<=5; i++) {
            if(i <= Math.floor(rating)) stars += '<i class="fas fa-star text-accent"></i>';
            else if(i === Math.ceil(rating) && !Number.isInteger(rating)) stars += '<i class="fas fa-star-half-alt text-accent"></i>';
            else stars += '<i class="far fa-star text-accent"></i>';
        }
        return stars;
    }

    function renderPlaces(filter = 'all') {
        const grid = document.getElementById('places-grid');
        grid.innerHTML = '';

        const filteredPlaces = filter === 'all' ? places : places.filter(p => p.category === filter);

        filteredPlaces.forEach(place => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition duration-300 cursor-pointer transform hover:-translate-y-1";
            card.onclick = () => openModal(place.id);
            
            card.innerHTML = `
                <div class="h-48 overflow-hidden relative">
                    <img src="${place.image}" alt="${place.name}" class="w-full h-full object-cover">
                    <div class="absolute top-3 right-3 bg-white px-2 py-1 rounded-lg text-sm font-bold flex items-center shadow">
                        <i class="fas fa-star text-accent mr-1"></i> ${place.rating.toFixed(1)}
                    </div>
                </div>
                <div class="p-5">
                    <div class="text-xs text-primary font-bold uppercase tracking-wider mb-1">${place.category}</div>
                    <h3 class="text-xl font-bold mb-2">${place.name}</h3>
                    <p class="text-gray-500 text-sm mb-4"><i class="fas fa-map-marker-alt mr-1"></i> ${place.location}</p>
                    <p class="text-gray-600 text-sm line-clamp-2">${place.description}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterPlaces(category) {
        // Update button styles
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.className = "cat-btn bg-white text-gray-600 hover:bg-gray-100 px-6 py-2 rounded-full border border-gray-200 font-medium shadow-sm flex-shrink-0 transition";
        });
        event.currentTarget.className = "cat-btn bg-primary text-white px-6 py-2 rounded-full font-medium shadow-sm flex-shrink-0 transition";
        
        renderPlaces(category);
    }

    function openModal(id) {
        currentSelectedPlaceId = id;
        const place = places.find(p => p.id === id);
        const modal = document.getElementById('place-modal');
        const modalBody = document.getElementById('modal-body');
        const content = document.getElementById('modal-content');

        let reviewsHTML = place.reviews.map(rev => `
            <div class="border-b border-gray-100 py-4 last:border-0">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-bold flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-sm"><i class="fas fa-user text-gray-500"></i></div>
                        ${rev.user}
                    </div>
                    <div class="text-sm text-gray-500">${rev.date}</div>
                </div>
                <div class="mb-2 text-sm">${renderStars(rev.rating)}</div>
                <p class="text-gray-700">${rev.text}</p>
            </div>
        `).join('');

        modalBody.innerHTML = `
            <div class="h-64 md:h-80 relative">
                <img src="${place.image}" class="w-full h-full object-cover rounded-t-2xl">
            </div>
            <div class="p-6 md:p-8">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-3xl font-serif font-bold text-gray-900">${place.name}</h2>
                        <p class="text-gray-500 mt-1"><i class="fas fa-map-marker-alt text-secondary mr-1"></i> ${place.location}</p>
                    </div>
                    <div class="bg-primary/10 text-primary px-3 py-1 rounded-lg text-lg font-bold flex items-center">
                        <i class="fas fa-star text-accent mr-1"></i> ${place.rating.toFixed(1)}
                    </div>
                </div>
                <p class="text-gray-700 text-lg mb-8 leading-relaxed">${place.description}</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Reviews List -->
                    <div>
                        <h3 class="text-xl font-bold mb-4 border-b pb-2">Reviews (${place.reviews.length})</h3>
                        <div class="max-h-96 overflow-y-auto pr-2" id="reviews-container">
                            ${reviewsHTML || '<p class="text-gray-500 italic">No reviews yet. Be the first!</p>'}
                        </div>
                    </div>
                    
                    <!-- Add Review Form -->
                    <div class="bg-gray-50 p-6 rounded-xl border border-gray-100">
                        <h3 class="text-xl font-bold mb-4">Add your review</h3>
                        
                        <!-- Privacy Notice -->
                        <div class="bg-blue-50 text-blue-800 text-xs p-3 rounded-lg mb-4 flex items-start gap-2">
                            <i class="fas fa-shield-alt mt-0.5"></i>
                            <p><strong>Privacy:</strong> Your data is secure. You can choose to post anonymously. Photos uploaded are checked for safety.</p>
                        </div>

                        <form id="review-form" onsubmit="submitReview(event)">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Your Rating</label>
                                <select id="new-rating" class="w-full border-gray-300 rounded-lg shadow-sm p-2 outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
                                    <option value="5">5 - Excellent</option>
                                    <option value="4">4 - Very Good</option>
                                    <option value="3">3 - Average</option>
                                    <option value="2">2 - Poor</option>
                                    <option value="1">1 - Terrible</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Share your experience</label>
                                <textarea id="new-review-text" rows="3" class="w-full border border-gray-300 rounded-lg shadow-sm p-3 outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none" placeholder="What did you like or dislike?" required></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Add Photos (Optional)</label>
                                <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-100 cursor-pointer transition">
                                    <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                                    <p class="text-sm text-gray-500">Click to upload or drag and drop</p>
                                </div>
                            </div>
                            <div class="flex items-center mb-4">
                                <input type="checkbox" id="anon-check" class="rounded text-primary focus:ring-primary mr-2">
                                <label for="anon-check" class="text-sm text-gray-600">Post anonymously</label>
                            </div>
                            <button type="submit" class="w-full bg-primary text-white font-medium py-3 rounded-lg shadow-md hover:bg-emerald-700 transition">
                                Post Review
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        `;

        modal.classList.remove('hidden');
        // Small delay to allow display:block to apply before animating opacity
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }, 10);
    }

    function closeModal() {
        const modal = document.getElementById('place-modal');
        const content = document.getElementById('modal-content');
        
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            currentSelectedPlaceId = null;
        }, 300);
    }

    function submitReview(e) {
        e.preventDefault(); // Prevent page reload
        
        const text = document.getElementById('new-review-text').value;
        const rating = parseInt(document.getElementById('new-rating').value);
        const isAnon = document.getElementById('anon-check').checked;
        
        // Find place and update state
        const placeIndex = places.findIndex(p => p.id === currentSelectedPlaceId);
        if(placeIndex !== -1) {
            // Data Sanitization happens in backend normally, here we just simulate
            const newReview = {
                user: isAnon ? "Anonymous User" : "Current User",
                text: text,
                rating: rating,
                date: "Just now"
            };
            
            places[placeIndex].reviews.unshift(newReview);
            
            // Recalculate average rating
            const totalRatings = places[placeIndex].reviews.reduce((sum, rev) => sum + rev.rating, 0);
            places[placeIndex].rating = totalRatings / places[placeIndex].reviews.length;
            
            // Refresh modal and grid
            openModal(currentSelectedPlaceId);
            renderPlaces('all'); // Reset grid view
            
            // Show Success Toast
            showToast("Review published successfully!");
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = message;
        
        toast.classList.remove('translate-y-20', 'opacity-0');
        
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
    }

    // Initialize application on load
    window.onload = () => {
        renderPlaces();
    };
</script>
</body>
</html>
